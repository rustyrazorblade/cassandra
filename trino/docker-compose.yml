# Local end-to-end test stack for the Arrow Flight PoC: this branch's Cassandra build (with the
# Arrow Flight service enabled) + Trino with the Arrow Flight connector installed +
# cassandra-easy-stress for loading sample data. See README.md for full usage.
#
# Prerequisite: build Cassandra on the HOST first. This compose file bind-mounts the built
# checkout rather than re-running Cassandra's full Ant/ivy build inside Docker (which would be
# far slower to iterate on and would re-resolve dependencies on every change):
#
#     cd .. && .build/sh/ai-build
#
# Then, from this directory:
#
#     docker compose up --build                       # Cassandra + Trino
#     docker compose --profile stress run --rm easy-stress   # load sample data (see below)
#
# Host port overrides (CASSANDRA_CQL_PORT/CASSANDRA_ARROW_FLIGHT_PORT/CASSANDRA_JMX_PORT/
# TRINO_PORT, defaults shown below) - useful if the standard ports are already taken by another
# Cassandra/Trino instance on your machine, e.g.:
#     CASSANDRA_CQL_PORT=19042 docker compose up --build
#
# The "sidecar" service requires cassandra-sidecar to be checked out as a SIBLING directory to
# this repo (../../cassandra-sidecar relative to this file, i.e. next to, not inside, this repo)
# and its distribution built on the host first:
#     cd ../../cassandra-sidecar && ./gradlew installDist -x test

services:
  cassandra:
    image: eclipse-temurin:21-jre-jammy
    container_name: arrow-flight-cassandra
    hostname: cassandra
    environment:
      CASSANDRA_HOME: /cassandra
      # Remote JMX (see cassandra-entrypoint.sh) - required for the sidecar service below to
      # connect; LOCAL_JMX's default local-only JMX port isn't reachable cross-process.
      LOCAL_JMX: "no"
    volumes:
      - ..:/cassandra
      - cassandra-data:/var/lib/cassandra
    entrypoint: ["/cassandra/trino/docker/cassandra-entrypoint.sh"]
    ports:
      - "${CASSANDRA_CQL_PORT:-9042}:9042"           # CQL native transport
      - "${CASSANDRA_ARROW_FLIGHT_PORT:-9143}:9143"  # Arrow Flight
      - "${CASSANDRA_JMX_PORT:-7199}:7199"           # JMX (nodetool, useful for debugging from the host)
      # Sidecar's port, published here (not on the "sidecar" service) since it uses
      # network_mode: "service:cassandra" and so has no ports of its own - other services reach
      # it at cassandra:9043 (sidecar shares this container's network identity entirely).
      - "${SIDECAR_PORT:-9043}:9043"
    healthcheck:
      test: ["CMD-SHELL", "/cassandra/bin/nodetool status 2>/dev/null | grep -q '^UN' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # Ring/topology discovery for the Trino connector's cluster-aware split planning (see
  # ARROW-FLIGHT.md and trino's ArrowFlightMetadata). Shares cassandra's network namespace so JMX
  # (127.0.0.1:7199) and CQL (127.0.0.1:9042) are both directly reachable without extra networking
  # config - matches cassandra-sidecar's own docker/cdc-demo/docker-compose.yml pattern.
  sidecar:
    build:
      context: ../../cassandra-sidecar
      dockerfile_inline: |
        FROM eclipse-temurin:11-jre-jammy
        WORKDIR /app
        COPY build/install/apache-cassandra-sidecar/ ./
        EXPOSE 9043
        ENTRYPOINT ["/app/bin/cassandra-sidecar"]
    container_name: arrow-flight-sidecar
    network_mode: "service:cassandra"
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      # Bind-mounted (not baked into the image) so editing it doesn't require a rebuild - matches
      # cassandra-sidecar's own cdc-demo compose file.
      - ./docker/sidecar.yaml:/app/conf/sidecar.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9043/api/v1/__health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  trino:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: arrow-flight-trino
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      # Docker-specific catalog config (points at the "cassandra" service, not 127.0.0.1) -
      # bind-mounted rather than baked into the image, so changing host/port only needs a
      # container restart, not a rebuild. See docker/catalog/arrow_flight.properties.
      - ./docker/catalog:/etc/trino/catalog:ro
    ports:
      - "${TRINO_PORT:-8080}:8080"

  # One-shot data loader, not part of the default `docker compose up`. Run explicitly:
  #     docker compose --profile stress run --rm easy-stress
  # RandomPartitionAccess writes single-column-family rows (partition_id text, row_id int,
  # value text) - a good stand-in for "one large partition per key" analytical-scan testing.
  # IMPORTANT: --iterations is a PER-THREAD count, not a total (see
  # WorkloadRunner/commands/Run.kt#createRunners - each of --threads workers runs the full
  # --iterations count independently). With --threads left at its default of 1, -i 10000000
  # below is exactly 10,000,000 total write operations - verified against a real run (see
  # README.md's "Loading test data" section). If you raise --threads, divide --iterations by
  # the thread count to keep the same total, or you will write threads*iterations rows.
  # --readrate/--deleterate 0 makes every operation an insert (RandomPartitionAccess otherwise
  # defaults to a small nonzero read rate).
  # This command itself (host/port/args shape) is verified against the LOCAL build
  # (~/dev/cassandra-easy-stress or equivalent checkout run directly against the host-mapped
  # CQL port) - the containerized image's own entrypoint was not independently re-verified. If
  # this container's entrypoint doesn't accept the same arguments, check it directly:
  #     docker compose --profile stress run --rm --entrypoint sh easy-stress -c 'cassandra-easy-stress --help || bin/cassandra-easy-stress --help'
  easy-stress:
    image: ghcr.io/apache/cassandra-easy-stress:latest
    container_name: arrow-flight-easy-stress
    profiles: ["stress"]
    depends_on:
      cassandra:
        condition: service_healthy
    command:
      - run
      - RandomPartitionAccess
      - --host
      - cassandra
      - --port
      - "9042"
      - -i
      - "10000000"
      - --readrate
      - "0"
      - --deleterate
      - "0"
      - --replication
      - "{'class': 'SimpleStrategy', 'replication_factor':1}"

volumes:
  cassandra-data:
