# Docker-compose variant of ../../catalog/arrow_flight.properties: points at the "cassandra"
# service's hostname on the compose network instead of 127.0.0.1. See ../../README.md for the
# manual (non-docker) setup this mirrors, and ../../docker-compose.yml for how this gets mounted.

connector.name=cassandra_arrow_flight

arrow-flight.host=cassandra
arrow-flight.port=9143

# sidecar shares the "cassandra" service's network namespace (network_mode: "service:cassandra"
# in docker-compose.yml) and listens on its own port 9043 there, same as from inside that
# container - see docker/sidecar.yaml.
sidecar.contact-points=cassandra:9043
arrow-flight.splits-per-node=4
