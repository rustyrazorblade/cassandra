# cassandra-sidecar config for this docker-compose stack. Adapted from
# cassandra-sidecar's own docker/cdc-demo/conf/sidecar.yaml example, minus the CDC/Kafka-specific
# bits (not needed here - see ../docker-compose.yml for how this is used: sidecar runs with
# network_mode: "service:cassandra", sharing that container's network namespace, so JMX/CQL are
# both reachable via 127.0.0.1/cassandra from inside the sidecar process).
cassandra_instances:
  - id: 1
    host: cassandra
    port: 9042
    storage_dir: /var/lib/cassandra
    commitlog_dir: /var/lib/cassandra/commitlog
    staging_dir: /var/lib/cassandra/sstable-staging
    jmx_host: 127.0.0.1
    jmx_port: 7199
    jmx_ssl_enabled: false  # dev-only stack, matches cassandra's own no-auth/no-TLS posture

sidecar:
  host: 0.0.0.0
  port: 9043
  worker_pools:
    service:
      name: "sidecar-worker-pool"
      size: 20
      max_execution_time: 1m
    internal:
      name: "sidecar-internal-worker-pool"
      size: 20
      max_execution_time: 15m
  jmx:
    max_retries: 10
    retry_delay: 3s
  # Required: sidecar creates its own internal keyspace/tables (leases, configs) here.
  schema:
    is_enabled: true
    keyspace: sidecar_internal
    replication_strategy: NetworkTopologyStrategy
    replication_factor: 1
    lease_schema_ttl: 5m
  coordination:
    cluster_lease_claim:
      electorate_membership_strategy: MostReplicatedKeyspaceTokenZeroElectorateMembership
      enabled: true
      initial_delay: 1s
      initial_delay_random_delta: 5s
      execute_interval: 100s

driver_parameters:
  contact_points:
    - "cassandra:9042"
  num_connections: 6
  # SimpleSnitch (this stack's endpoint_snitch) always reports "datacenter1"/"rack1" - see
  # org.apache.cassandra.locator.SimpleLocationProvider.
  local_dc: datacenter1

healthcheck:
  initial_delay: 0ms
  execute_interval: 30s

cluster_topology_monitor:
  enabled: true
  initial_delay: 0s
  execute_interval: 1000ms
