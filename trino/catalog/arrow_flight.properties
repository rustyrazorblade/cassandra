# Trino catalog configuration for the Cassandra Arrow Flight connector.
# Copy this file to <TRINO_HOME>/etc/catalog/arrow_flight.properties (the catalog will then be
# named "arrow_flight"; rename the file to change the catalog name).
#
# See trino/README.md for full setup instructions.

connector.name=cassandra_arrow_flight

# Host/port of a Cassandra node running the Arrow Flight service
# (start_arrow_flight: true in cassandra.yaml). Port 9143 is the Cassandra-side default
# (arrow_flight_port in cassandra.yaml).
arrow-flight.host=127.0.0.1
arrow-flight.port=9143
