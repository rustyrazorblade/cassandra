# Trino catalog configuration for the Cassandra Arrow Flight connector.
# Copy this file to <TRINO_HOME>/etc/catalog/arrow_flight.properties (the catalog will then be
# named "arrow_flight"; rename the file to change the catalog name).
#
# See trino/README.md for full setup instructions.

connector.name=cassandra_arrow_flight

# Bootstrap contact point for schema discovery ONLY (any live node - the Arrow schema is uniform
# cluster-wide). Actual scans are cluster-aware: each split is routed directly to its owning
# replica(s), discovered via sidecar.contact-points below, not through this host/port. Port 9143
# is the Cassandra-side default (arrow_flight_port in cassandra.yaml); it is also assumed uniform
# across every node (sidecar has no notion of this custom port).
arrow-flight.host=127.0.0.1
arrow-flight.port=9143

# Comma-separated host:port cassandra-sidecar contact point(s), used to discover ring/topology
# for split planning (see trino/README.md and ArrowFlightTopologyService). Port defaults to 9043
# (sidecar's stock default) if omitted from an entry.
sidecar.contact-points=127.0.0.1:9043

# Target number of splits per node (multiplied by node count to get overall parallelism - see
# TokenPartitioner). Defaults to 4 if omitted.
arrow-flight.splits-per-node=4
